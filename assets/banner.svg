<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title { font-family: system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 46px; fill: #ffffff; }
      .subtitle { font-family: system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #cbd5e1; }
      .badge-text { font-family: system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 14px; fill: #ffffff; }
      
      @keyframes floatParticle {
        0% { transform: translateY(0px) rotate(0deg); opacity: 0.3; }
        50% { transform: translateY(-15px) rotate(180deg); opacity: 0.8; }
        100% { transform: translateY(0px) rotate(360deg); opacity: 0.3; }
      }

      @keyframes pulseGlow {
        0% { opacity: 0.4; }
        50% { opacity: 0.8; }
        100% { opacity: 0.4; }
      }

      @keyframes slidePill {
        0% { transform: translateX(0px); }
        50% { transform: translateX(20px); }
        100% { transform: translateX(0px); }
      }

      .particle-1 { animation: floatParticle 6s ease-in-out infinite; }
      .particle-2 { animation: floatParticle 8s ease-in-out infinite 1s; }
      .particle-3 { animation: floatParticle 7s ease-in-out infinite 2s; }
      .glow-bg { animation: pulseGlow 4s ease-in-out infinite; }
      .animated-pill { animation: slidePill 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Glowing Orbs in Background -->
  <circle class="glow-bg" cx="150" cy="80" r="120" fill="#4f46e5" opacity="0.3" filter="url(#glow)" />
  <circle class="glow-bg" cx="1050" cy="270" r="140" fill="#ec4899" opacity="0.25" filter="url(#glow)" />

  <!-- Decorative Dynamic Background Elements (Pills/Cards behind text) -->
  <g opacity="0.15">
    <path class="animated-pill" d="M 800 60 Q 950 120 1100 80" stroke="url(#accentGrad)" stroke-width="4" fill="none" />
    <path class="animated-pill" d="M 850 180 Q 980 140 1120 220" stroke="url(#accentGrad)" stroke-width="3" fill="none" />
  </g>

  <!-- Dynamic Animated Shield Particle -->
  <g class="particle-1" transform="translate(100, 240)">
    <polygon points="20,0 40,10 40,30 20,45 0,30 0,10" fill="url(#badgeGrad)" opacity="0.6" />
  </g>
  <g class="particle-2" transform="translate(1060, 60)">
    <polygon points="15,0 30,7 30,22 15,33 0,22 0,7" fill="url(#accentGrad)" opacity="0.7" />
  </g>
  <g class="particle-3" transform="translate(920, 260)">
    <circle cx="12" cy="12" r="12" fill="#38bdf8" opacity="0.5" />
  </g>

  <!-- Main Content Foreground Container (Guaranteed Foreground) -->
  <g transform="translate(80, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 55)">
      <rect width="270" height="34" rx="17" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
      <circle cx="20" cy="17" r="6" fill="#10b981" />
      <text x="36" y="22" class="badge-text" fill="#94a3b8">🏆 Awesome Ecosystem List</text>
    </g>

    <!-- Main Title with Gradient Line Accent -->
    <text x="0" y="150" class="title">Awesome Credential Management 📜</text>
    <rect x="0" y="168" width="540" height="4" rx="2" fill="url(#accentGrad)" />

    <!-- Subtitle -->
    <text x="0" y="212" class="subtitle">Digital Badges • Open Badges 3.0 • Micro-Credentials • Verifiable Credentials</text>
    <text x="0" y="242" class="subtitle" opacity="0.8">Curated SaaS platforms, Open-Source issuer stacks, and standards tooling.</text>

    <!-- Bottom Tech Pills -->
    <g transform="translate(0, 275)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="30" rx="8" fill="#334155" opacity="0.8" />
      <text x="65" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Open Badges 3.0</text>
      <!-- Pill 2 -->
      <rect x="142" y="0" width="160" height="30" rx="8" fill="#334155" opacity="0.8" />
      <text x="222" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">W3C Verifiable Credentials</text>
      <!-- Pill 3 -->
      <rect x="314" y="0" width="140" height="30" rx="8" fill="#334155" opacity="0.8" />
      <text x="384" y="19" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Learner Portfolios</text>
    </g>
  </g>
</svg>
