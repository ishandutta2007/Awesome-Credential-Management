<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="accentGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#6366f1"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="badgeGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6"/><stop offset="100%" stop-color="#8b5cf6"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes floatParticle{0%{transform:translateY(0) rotate(0deg);opacity:.3}50%{transform:translateY(-15px) rotate(180deg);opacity:.8}}@keyframes pulseGlow{0%{opacity:.4}50%{opacity:.8}}@keyframes slidePill{0%{transform:translateX(0)}50%{transform:translateX(20px)}}.badge-text,.subtitle,.title{font-family:system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:46px;fill:#fff}.subtitle{font-weight:500;font-size:20px;fill:#cbd5e1}.badge-text{font-weight:600;font-size:14px;fill:#fff}.particle-1{animation:floatParticle 6s ease-in-out infinite}.particle-2{animation:floatParticle 8s ease-in-out infinite 1s}.particle-3{animation:floatParticle 7s ease-in-out infinite 2s}.glow-bg{animation:pulseGlow 4s ease-in-out infinite}.animated-pill{animation:slidePill 5s ease-in-out infinite}</style></defs><rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/><circle cx="150" cy="80" r="120" fill="#4f46e5" class="glow-bg" filter="url(#glow)" opacity=".3"/><circle cx="1050" cy="270" r="140" fill="#ec4899" class="glow-bg" filter="url(#glow)" opacity=".25"/><g opacity=".15"><path fill="none" stroke="url(#accentGrad)" stroke-width="4" d="M 800 60 Q 950 120 1100 80" class="animated-pill"/><path fill="none" stroke="url(#accentGrad)" stroke-width="3" d="M 850 180 Q 980 140 1120 220" class="animated-pill"/></g><g class="particle-1" transform="translate(100, 240)"><polygon fill="url(#badgeGrad)" points="20 0 40 10 40 30 20 45 0 30 0 10" opacity=".6"/></g><g class="particle-2" transform="translate(1060, 60)"><polygon fill="url(#accentGrad)" points="15 0 30 7 30 22 15 33 0 22 0 7" opacity=".7"/></g><g class="particle-3" transform="translate(920, 260)"><circle cx="12" cy="12" r="12" fill="#38bdf8" opacity=".5"/></g><g transform="translate(80, 0)"><g transform="translate(0, 55)"><rect width="270" height="34" fill="#1e293b" stroke="#334155" stroke-width="1.5" rx="17"/><circle cx="20" cy="17" r="6" fill="#10b981"/><text x="36" y="22" fill="#94a3b8" class="badge-text">🏆 Awesome Ecosystem List</text></g><text x="0" y="150" class="title">Awesome Credential Management 📜</text><rect width="540" height="4" x="0" y="168" fill="url(#accentGrad)" rx="2"/><text x="0" y="212" class="subtitle">Digital Badges • Open Badges 3.0 • Micro-Credentials • Verifiable Credentials</text><text x="0" y="242" class="subtitle" opacity=".8">Curated SaaS platforms, Open-Source issuer stacks, and standards tooling.</text><g transform="translate(0, 275)"><rect width="130" height="30" x="0" y="0" fill="#334155" opacity=".8" rx="8"/><text x="65" y="19" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Open Badges 3.0</text><rect width="160" height="30" x="142" y="0" fill="#334155" opacity=".8" rx="8"/><text x="222" y="19" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">W3C Verifiable Credentials</text><rect width="140" height="30" x="314" y="0" fill="#334155" opacity=".8" rx="8"/><text x="384" y="19" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Learner Portfolios</text></g></g></svg>